server.port=8080

# Host (admin) account, seeded on first boot. Override with env vars.
hermes.dashboard.host-username=${HERMES_DASH_HOST_USER:Akash}
hermes.dashboard.host-password=${HERMES_DASH_HOST_PASSWORD:Free@2006}
# Secret for signing JWTs. Override with HERMES_DASH_JWT_SECRET.
hermes.dashboard.jwt-secret=${HERMES_DASH_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
hermes.dashboard.jwt-ttl-minutes=${HERMES_DASH_JWT_TTL:720}

# Where the Hermes home lives (skills/, sessions/).
hermes.dashboard.hermes-home=${HERMES_HOME:${user.home}/.hermes}
# Command used to ask Hermes a question. Tested against a fake in unit tests.
hermes.dashboard.hermes-command=${HERMES_DASH_HERMES_CMD:hermes}

spring.datasource.url=jdbc:h2:mem:dashboard;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
